memory_limit = 512M
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 300
max_input_time = 300
pcre.jit = 0
date.timezone = UTC
session.cookie_httponly = 1
display_errors = Off
display_startup_errors = Off
expose_php = Off
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 50000
opcache.validate_timestamps = 0
apc.enabled = 1
