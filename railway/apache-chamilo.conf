ServerName localhost
Listen ${PORT}
<VirtualHost *:${PORT}>
  DocumentRoot /var/www/chamilo/public/
  RewriteEngine On
  # Railway terminates TLS at its edge and forwards plain HTTP.
  SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
  <Directory /var/www/chamilo/public>
    AllowOverride All
    Require all granted
  </Directory>
  <LocationMatch "/\.git">
    Require all denied
  </LocationMatch>
  <LocationMatch "^/documentation">
    Require all denied
  </LocationMatch>
  ErrorLog /proc/self/fd/2
  CustomLog /proc/self/fd/1 combined
</VirtualHost>
